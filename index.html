<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bombay Standard — Coming Soon</title>
  <meta name="description" content="Bombay Standard — something timeless is on its way. Coming soon." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />

  <!-- Social preview -->
  <meta property="og:title" content="Bombay Standard — Coming Soon" />
  <meta property="og:description" content="Something timeless is on its way." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bombaystandard.com" />
  <meta property="og:image" content="https://bombaystandard.com/logo.svg" />
  <meta name="theme-color" content="#0f1226" />

  <style>
    :root {
      --bg-deep: #0c0e1f;
      --bg-soft: #15183a;
      --gold: #f6c44b;
      --gold-bright: #ffd766;
      --ink: #f4f1e8;
      --muted: #a9a8c0;
      --blue: #3e4095;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(62, 64, 149, 0.45), transparent 60%),
        radial-gradient(900px 600px at 50% 120%, rgba(246, 196, 75, 0.10), transparent 55%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-soft) 100%);
      color: var(--ink);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      overflow: hidden;
      position: relative;
    }

    /* faint dotted texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.4;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      width: 100%;
      animation: rise 1s ease-out both;
    }

    .logo-halo {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
      width: min(820px, 94vw);
    }

    .logo-halo::after {
      content: "";
      position: absolute;
      inset: -14% -8%;
      background: radial-gradient(closest-side, rgba(246, 196, 75, 0.28), transparent 75%);
      filter: blur(22px);
      z-index: -1;
      animation: pulse 5s ease-in-out infinite;
    }

    .logo {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.55));
    }

    .rule {
      width: 0;
      height: 2px;
      margin: 4px auto 26px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: grow 1.2s ease-out 0.5s forwards;
    }

    .company {
      font-size: clamp(0.74rem, 2.5vw, 0.98rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--gold);
      opacity: 0.92;
      margin: 0 auto 0 0.3em; /* 0.3em offsets letter-spacing */
    }

    .tagline {
      font-size: clamp(1rem, 3.6vw, 1.35rem);
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: 0.46em; /* optical balance for letter-spacing */
    }

    .tagline .dot {
      display: inline-block;
      color: var(--gold);
      animation: blink 1.4s steps(1) infinite;
    }
    .tagline .dot:nth-child(2) { animation-delay: 0.2s; }
    .tagline .dot:nth-child(3) { animation-delay: 0.4s; }

    .footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(169, 168, 192, 0.55);
      z-index: 1;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.04); }
    }
    @keyframes grow { to { width: 140px; } }
    @keyframes blink {
      0%, 60% { opacity: 1; }
      80%, 100% { opacity: 0.2; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rule { width: 140px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo-halo">
      <img class="logo" src="logo.svg" alt="Bombay Standard" />
    </div>
    <p class="company">Abiomye Industries Private Limited</p>
    <div class="rule"></div>
    <p class="tagline">
      Coming Soon<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </p>
  </main>

  <footer class="footer">
    &copy; <span id="year">2026</span> Abiomye Industries Private Limited
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
